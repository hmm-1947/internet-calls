<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laila Now — Talk. Connect. Belong.</title>
<meta name="description" content="Laila Now is available on the Google Play Store. Download the app to start connecting.">
<link rel="icon" href="data:,">
<style>
  :root {
    --pink: #ff4d8d;
    --pink-dark: #e63e79;
    --bg: #0f0a14;
    --bg-alt: #17111f;
    --text: #f5f0f7;
    --dim: #b7abc4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 20% 0%, #241533 0%, var(--bg) 45%, var(--bg) 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  .glow.one { width: 320px; height: 320px; background: var(--pink); top: -100px; left: -80px; }
  .glow.two { width: 260px; height: 260px; background: #7a4dff; bottom: -80px; right: -60px; }

  .card {
    position: relative;
    z-index: 1;
    max-width: 460px;
    width: 100%;
    text-align: center;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 48px 36px 40px;
    backdrop-filter: blur(6px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }

  .logo {
    width: 84px;
    height: 84px;
    margin: 0 auto 20px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--pink), #9b4dff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 10px 30px rgba(255, 77, 141, 0.35);
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
  }

  h1 span { color: var(--pink); }

  p.tagline {
    color: var(--dim);
    font-size: 15.5px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .store-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 28px;
  }

  .store-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 20px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .store-btn.primary {
    background: linear-gradient(135deg, var(--pink), var(--pink-dark));
    color: #fff;
    box-shadow: 0 10px 24px rgba(255, 77, 141, 0.3);
  }

  .store-btn.secondary {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .store-btn:hover {
    transform: translateY(-2px);
  }

  .store-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 26px 0 22px;
    color: var(--dim);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255, 255, 255, 0.1);
  }

  .features {
    display: flex;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .feature {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--dim);
    max-width: 100px;
  }

  .feature .icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: rgba(255, 77, 141, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 28px;
    color: var(--dim);
    font-size: 13px;
    text-align: center;
  }

  footer a {
    color: var(--pink);
    text-decoration: none;
  }

  @media (min-width: 480px) {
    .store-buttons { flex-direction: row; }
    .store-btn { flex: 1; }
  }
</style>
</head>
<body>

  <div class="glow one"></div>
  <div class="glow two"></div>

  <div class="card">
    <div class="logo">L</div>
    <h1>Welcome to <span>Laila Now</span></h1>
    <p class="tagline">
      Real conversations, real connections. Download the Laila Now app to start talking, chatting, and meeting new people today.
    </p>

    <div class="store-buttons">
      <a class="store-btn primary" href="https://play.google.com/store/apps" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 2.5c-.3.3-.5.7-.5 1.2v16.6c0 .5.2.9.5 1.2l.1.1L13 12l-9.9-9.5H3z" fill="#fff"/>
          <path d="M16.4 15.4L13 12l3.4-3.4 4.3 2.5c.9.5.9 1.9 0 2.4l-4.3 2.9z" fill="#fff" opacity="0.9"/>
          <path d="M13 12L3.1 21.6c.3.3.8.4 1.4.1l11.9-6.9-3.4-2.8z" fill="#fff" opacity="0.75"/>
          <path d="M16.4 8.6L13 12 3.1 2.4c.3-.3.8-.4 1.4-.1l11.9 6.3z" fill="#fff" opacity="0.75"/>
        </svg>
        Get it on Google Play
      </a>
      <a class="store-btn secondary" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.5 12.3c0-2.4 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.1 2.5-1.8 3.1-.5 7.6 1.3 10.1.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.4-.8s2 .8 3.3.8c1.4 0 2.3-1.3 3.1-2.4.7-1.1 1.1-2.2 1.1-2.2s-2.7-1-2.7-3.9z" fill="var(--text)"/>
          <path d="M14.7 5c.7-.8 1.1-1.9 1-3-.9.1-2 .6-2.7 1.5-.6.7-1.1 1.8-1 2.9 1 .1 2-.5 2.7-1.4z" fill="var(--text)"/>
        </svg>
        Coming soon on App Store
      </a>
    </div>

    <div class="divider">Why Laila Now</div>

    <div class="features">
      <div class="feature">
        <div class="icon">💬</div>
        Chat &amp; Call
      </div>
      <div class="feature">
        <div class="icon">🌍</div>
        Meet People
      </div>
      <div class="feature">
        <div class="icon">🔒</div>
        Safe &amp; Private
      </div>
    </div>
  </div>

  <footer>
    &copy; <span id="year"></span> Laila Now. All rights reserved.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
