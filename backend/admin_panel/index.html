<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Admin ka Panel</title>
  <style>
    :root {
      --mint: #201a1a;
      --leaf: #c9636b;
      --leaf-dark: #a84850;
      --sky: #bf5158;
      --sky-dark: #a04148;
      --ink: #d8c9c9;
      --slate: #9c8484;
      --line: #3a2e2e;
      --white: rgba(35, 28, 28, .5);
      --danger: #d9727a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      max-width: 1500px;
      margin: 32px auto;
      padding: 0 20px;
      background:
        radial-gradient(circle at 15% 10%, rgba(191, 81, 88, .08), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(168, 72, 80, .06), transparent 45%),
        #221c1c;
      color: var(--ink);
      min-height: 100vh;
    }

    h1 {
      font-size: 24px;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--line);
    }

    h1 .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--sky);
      box-shadow: 0 0 8px 1px rgba(191, 81, 88, .3);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 14px;
      letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--slate);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    input {
      padding: 10px 12px;
      margin: 5px 0;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      background: rgba(255, 255, 255, .06);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--ink);
      font-size: 13px;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      outline: none;
      border-color: var(--sky);
      box-shadow: 0 0 0 3px rgba(240, 74, 83, .18);
    }

    .btn {
      padding: 10px 18px;
      margin: 4px 2px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .2px;
      text-transform: uppercase;
      transition: background .15s, transform .1s, box-shadow .15s;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(191, 81, 88, .8), rgba(120, 42, 48, .8));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #f0e6e6;
      width: 100%;
      box-shadow: 0 3px 10px rgba(191, 81, 88, .2), inset 0 1px 0 rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .12);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(191, 81, 88, .9), rgba(160, 65, 72, .9));
      box-shadow: 0 4px 14px rgba(191, 81, 88, .3), inset 0 1px 0 rgba(255, 255, 255, .15);
    }

    .btn-danger {
      background: rgba(217, 114, 122, .1);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--danger);
      border: 1px solid rgba(217, 114, 122, .35);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #221c1c;
    }

    .btn-leaf {
      background: linear-gradient(135deg, rgba(201, 99, 107, .8), rgba(168, 72, 80, .8));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #f0e6e6;
      box-shadow: 0 3px 10px rgba(201, 99, 107, .2), inset 0 1px 0 rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .12);
    }

    .btn-leaf:hover {
      background: linear-gradient(135deg, rgba(201, 99, 107, .9), rgba(168, 72, 80, .9));
      box-shadow: 0 4px 14px rgba(201, 99, 107, .3), inset 0 1px 0 rgba(255, 255, 255, .15);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .06);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--ink);
      border: 1px solid rgba(255, 255, 255, .14);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, .12);
    }

    .btn-ghost:disabled {
      opacity: .4;
      cursor: default;
    }

    .card {
      background: var(--white);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-radius: 16px;
      padding: 20px 22px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .08);
      margin-bottom: 22px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-top: 3px solid var(--sky);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 13px;
    }

    th {
      background: #1c1414;
      color: var(--sky);
      padding: 10px 8px;
      text-align: left;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: .4px;
      border-bottom: 2px solid var(--sky);
    }

    td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: #241414;
    }

    #msg {
      margin-top: 10px;
      font-weight: 600;
      font-size: 13px;
    }

    .ok {
      color: var(--leaf-dark);
    }

    .err {
      color: var(--danger);
    }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-yes {
      background: #2a1414;
      color: #ff5c5c;
    }

    .badge-no {
      background: #241010;
      color: var(--danger);
    }

    .badge-role {
      background: #241414;
      color: #ff8080;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
    }

    .sidebar {
      background: var(--white);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .08);
      max-height: 760px;
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, .12);
    }

    .sidebar-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--mint);
      color: var(--slate);
    }

    .tab.active {
      background: var(--sky);
      color: var(--white);
    }

    .search-box {
      margin-bottom: 8px;
    }

    .person-item {
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 5px;
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .person-item:hover {
      background: #241414;
    }

    .person-item.selected {
      background: #2a1010;
      border-color: var(--leaf);
    }

    .person-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--ink);
    }

    .person-sub {
      font-size: 12px;
      color: var(--slate);
    }

    .content {
      background: var(--white);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .08);
      min-height: 400px;
      border: 1px solid rgba(255, 255, 255, .12);
    }

    .empty-state {
      color: var(--slate);
      text-align: center;
      padding: 60px 20px;
      font-size: 14px;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--mint);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .detail-header h3 {
      margin: 0;
      font-size: 18px;
      color: var(--ink);
    }

    .detail-header .person-sub {
      font-size: 13px;
    }

    .section-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .section-tab {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--mint);
      color: var(--slate);
    }

    .section-tab.active {
      background: var(--leaf);
      color: var(--white);
    }

    .page-size-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--slate);
    }

    .page-size-row select {
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--white);
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 14px 0 2px;
      font-size: 13px;
      color: var(--slate);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    audio {
      height: 30px;
    }

    .chat-thread {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 6px;
    }

    .chat-row {
      display: flex;
    }

    .chat-row.left {
      justify-content: flex-start;
    }

    .chat-row.right {
      justify-content: flex-end;
    }

    .chat-bubble {
      max-width: 60%;
      min-width: 60px;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
    }


    .bubble-left {
      background: #241414;
      color: var(--ink);
      border-bottom-left-radius: 2px;
    }

    .bubble-right {
      background: var(--leaf);
      color: var(--white);
      border-bottom-right-radius: 2px;
    }

    .chat-bubble {
      min-width: 60px;
    }

    .chat-meta {
      font-weight: 700;
      font-size: 11px;
      opacity: .8;
      margin-bottom: 2px;
    }

    .chat-time {
      font-size: 10px;
      opacity: .7;
      float: right;
      margin-left: 8px;
      margin-top: 4px;
      shape-outside: inset(0 0 0 0);
    }

    .chat-scroll {
      max-height: 500px;
      overflow-y: auto;
      padding: 6px;
    }

    .chat-date-divider {
      display: flex;
      justify-content: center;
      margin: 14px 0;
    }

    .other-person-picker {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .other-person-picker label {
      font-size: 12px;
      font-weight: 700;
      color: var(--slate);
    }

    .other-person-picker select {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .other-person-picker select:focus {
      outline: none;
      border-color: var(--leaf);
    }

    .pair-arrow-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .pair-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--ink);
    }

    .pair-arrow {
      font-size: 22px;
      color: var(--leaf);
    }

    .chat-date-label {
      background: var(--mint);
      color: var(--slate);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div id="loginScreen" style="max-width:380px;margin:80px auto;">
    <div class="card">
      <h2>Admin Login</h2>
      <input id="loginIdentifier" placeholder="Username or Email">
      <input id="loginPassword" placeholder="Password" type="password">
      <button class="btn btn-primary" onclick="doAdminLogin()">Login</button>
      <div style="margin-top:8px;text-align:right;">
        <a href="#" style="font-size:13px;font-weight:600;" onclick="showForgotScreen();return false;">Forgot password?</a>
      </div>
      <div id="loginMsg" style="margin-top:10px;font-weight:600;font-size:13px;"></div>
    </div>
  </div>

  <div id="forgotScreen" style="max-width:380px;margin:80px auto;display:none;">
    <div class="card">
      <h2>Reset Password</h2>
      <div id="forgotStepEmail">
        <input id="forgotEmail" placeholder="Email address">
        <button class="btn btn-primary" onclick="requestForgotOtp()">Send verification code</button>
      </div>
      <div id="forgotStepOtp" style="display:none;">
        <input id="forgotOtp" placeholder="Enter OTP">
        <button class="btn btn-primary" onclick="verifyForgotOtp()">Verify code</button>
      </div>
      <div id="forgotStepReset" style="display:none;">
        <input id="forgotNewPassword" placeholder="New password" type="password">
        <input id="forgotConfirmPassword" placeholder="Confirm password" type="password">
        <button class="btn btn-primary" onclick="resetForgotPassword()">Reset password</button>
      </div>
      <div id="forgotMsg" style="margin-top:10px;font-weight:600;font-size:13px;"></div>
      <div style="margin-top:8px;">
        <a href="#" style="font-size:13px;font-weight:600;" onclick="showLoginScreen();return false;">Back to login</a>
      </div>
    </div>
  </div>

  <div id="setupScreen" style="max-width:420px;margin:80px auto;display:none;">
    <div class="card">
      <h2>Set Up Admin Account</h2>
      <div id="setupStepEmail">
        <input id="setupEmail" placeholder="Email address">
        <button class="btn btn-primary" onclick="requestSetupOtp()">Send verification code</button>
      </div>
      <div id="setupStepOtp" style="display:none;">
        <input id="setupOtp" placeholder="Enter OTP">
        <button class="btn btn-primary" onclick="verifySetupOtp()">Verify code</button>
      </div>
      <div id="setupStepCreds" style="display:none;">
        <input id="setupUsername" placeholder="Choose a username">
        <input id="setupPassword" placeholder="Choose a password" type="password">
        <button class="btn btn-primary" onclick="completeSetup()">Create account</button>
      </div>
      <div id="setupMsg" style="margin-top:10px;font-weight:600;font-size:13px;"></div>
    </div>
  </div>

  <div id="panelRoot" style="display:none;">

  <h1><span class="dot"></span>Admin ka Panel
    <button class="btn btn-ghost" style="margin-left:auto" onclick="doAdminLogout()">Logout</button>
  </h1>


  <div class="grid-2">
    <div class="card">
      <h2>Register Listener</h2>
      <input id="name" placeholder="Name">
      <input id="phone" placeholder="Phone">
      <input id="password" placeholder="Password" type="password">
      <button class="btn btn-primary" onclick="registerListener()">Register Listener</button>
      <div id="msg"></div>
    </div>

    <div class="card">
      <h2>Coin Settings</h2>
      <label style="font-size:13px;color:var(--slate);font-weight:600">Audio call coin deduction / minute</label>
      <input id="audioCoins" placeholder="e.g. 10" type="number">
      <label style="font-size:13px;color:var(--slate);font-weight:600">Video call coin deduction / minute</label>
      <input id="videoCoins" placeholder="e.g. 20" type="number">
      <label style="font-size:13px;color:var(--slate);font-weight:600">Chat message coin deduction / message</label>
      <input id="chatCoins" placeholder="e.g. 1" type="number">
      <button class="btn btn-leaf" onclick="saveCoinSettings()">Save Settings</button>

    </div>
  </div>

  <div class="card">
    <h2 id="billingFormTitle">Add Billing Plan</h2>
    <input type="hidden" id="billingPlanId">
    <label style="font-size:13px;color:var(--slate);font-weight:600">Plan name</label>
    <input id="billingName" placeholder="e.g. Value Pack">
    <label style="font-size:13px;color:var(--slate);font-weight:600">Price</label>
    <input id="billingPrice" placeholder="e.g. 499" type="number">
    <label style="font-size:13px;color:var(--slate);font-weight:600">Billing cycle</label>
    <select id="billingPlanType" style="padding:10px 12px;margin:5px 0;width:100%;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.06);color:var(--ink);font-size:13px;">
      <option value="monthly">Monthly</option>
      <option value="quarterly">Quarterly</option>
      <option value="yearly">Yearly</option>
    </select>
    <label style="font-size:13px;color:var(--slate);font-weight:600">Validity (number of cycles, e.g. 1)</label>
    <input id="billingValidity" placeholder="e.g. 1" type="number">
    <label style="font-size:13px;color:var(--slate);font-weight:600">Features / description (one per line)</label>
    <textarea id="billingDescription" placeholder="e.g. Unlimited chat&#10;Priority support" style="padding:10px 12px;margin:5px 0;width:100%;min-height:80px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.06);color:var(--ink);font-size:13px;font-family:inherit;"></textarea>
    <label style="font-size:13px;color:var(--slate);font-weight:600;display:flex;align-items:center;gap:8px;margin-top:8px;">
      <input type="checkbox" id="billingFeatured" style="width:auto;margin:0;"> Mark as Best Seller
    </label>
    <label style="font-size:13px;color:var(--slate);font-weight:600;display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="billingActive" style="width:auto;margin:0;" checked> Active (visible to users)
    </label>
    <button class="btn btn-leaf" onclick="saveBillingPlan()">Save Plan</button>
    <button class="btn btn-ghost" id="billingCancelEdit" style="display:none;" onclick="resetBillingForm()">Cancel edit</button>
    <div id="billingMsg" style="margin-top:8px;font-weight:600;font-size:13px;"></div>
  </div>

  <div class="card">
    <h2>Billing Plans</h2>
    <div id="billingPlansList"></div>
  </div>

  <div class="card">
    <h2>Invite New Admin</h2>
    <button class="btn btn-primary" style="width:auto" onclick="generateAdminInvite()">Generate Invite Link</button>
    <div id="inviteLinkWrap" style="margin-top:10px;"></div>
  </div>

  <div class="card">
    <h2>People
      <button class="btn btn-ghost" onclick="loadPeople()">↻ Refresh</button>
    </h2>
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-tabs">
          <div class="tab active" id="tabUsers" onclick="switchPeopleTab('user')">Users</div>
          <div class="tab" id="tabListeners" onclick="switchPeopleTab('listener')">Listeners</div>
        </div>
        <input class="search-box" id="personSearch" placeholder="Search by name or phone" oninput="renderPeopleList()">
        <div id="peopleList"></div>
      </div>

      <div class="content" id="personContent">
        <div class="empty-state">Select a user or listener from the list to view their call logs and recordings.</div>
      </div>
    </div>
  </div>

  </div>

<script src="config.js"></script>
  <script>
      const API_URL = CONFIG.API_URL;

    function getAdminToken() { return localStorage.getItem('adminToken') || ''; }
    function setAdminToken(t) { localStorage.setItem('adminToken', t); }
    function clearAdminToken() { localStorage.removeItem('adminToken'); }

    const _origFetch = window.fetch;
    window.fetch = function (...args) {
      return _origFetch(...args).then(res => {
        if (res.status === 401 && document.getElementById('panelRoot').style.display !== 'none') {
          clearAdminToken();
          showLoginScreen();
        }
        return res;
      });
    };

    function authHeaders(json) {
      const h = { 'Authorization': 'Bearer ' + getAdminToken() };
      if (json) h['Content-Type'] = 'application/json';
      return h;
    }

    function showLoginScreen() {
      document.getElementById('loginScreen').style.display = '';
      document.getElementById('forgotScreen').style.display = 'none';
      document.getElementById('setupScreen').style.display = 'none';
      document.getElementById('panelRoot').style.display = 'none';
    }

    function showForgotScreen() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('forgotScreen').style.display = '';
      document.getElementById('setupScreen').style.display = 'none';
      document.getElementById('panelRoot').style.display = 'none';
      document.getElementById('forgotStepEmail').style.display = '';
      document.getElementById('forgotStepOtp').style.display = 'none';
      document.getElementById('forgotStepReset').style.display = 'none';
      document.getElementById('forgotEmail').value = '';
      document.getElementById('forgotOtp').value = '';
      document.getElementById('forgotNewPassword').value = '';
      document.getElementById('forgotConfirmPassword').value = '';
      setForgotMsg('', null);
    }

    function setForgotMsg(text, ok) {
      const el = document.getElementById('forgotMsg');
      el.textContent = text;
      el.className = ok === true ? 'ok' : ok === false ? 'err' : '';
    }

    async function requestForgotOtp() {
      const email = document.getElementById('forgotEmail').value.trim();
      if (!email) { setForgotMsg('Enter your email.', false); return; }
      setForgotMsg('Sending code…', null);
      try {
        const res = await fetch(API_URL + '/admin/auth/forgot-password/request-otp', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Failed to send code');
        setForgotMsg('✓ Code sent to ' + email, true);
        document.getElementById('forgotStepEmail').style.display = 'none';
        document.getElementById('forgotStepOtp').style.display = '';
      } catch (e) { setForgotMsg('✗ ' + e.message, false); }
    }

    async function verifyForgotOtp() {
      const email = document.getElementById('forgotEmail').value.trim();
      const otp_code = document.getElementById('forgotOtp').value.trim();
      if (!otp_code) { setForgotMsg('Enter the OTP.', false); return; }
      setForgotMsg('Verifying…', null);
      try {
        const res = await fetch(API_URL + '/admin/auth/forgot-password/verify-otp', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },

    async function saveBillingPlan() {
      const id = document.getElementById('billingPlanId').value;
      const name = document.getElementById('billingName').value.trim();
      const price = parseInt(document.getElementById('billingPrice').value);
      const plan_type = document.getElementById('billingPlanType').value;
      const validity_value = parseInt(document.getElementById('billingValidity').value);
      const description = document.getElementById('billingDescription').value.trim();
      const is_featured = document.getElementById('billingFeatured').checked;
      const is_active = document.getElementById('billingActive').checked;

      if (!name) { setBillingMsg('✗ Plan name is required.', false); return; }
      if (!price || price <= 0) { setBillingMsg('✗ Price must be greater than 0.', false); return; }
      if (!validity_value || validity_value <= 0) { setBillingMsg('✗ Validity must be greater than 0.', false); return; }

      const payload = { name, price, plan_type, validity_value, description, is_featured, is_active, sort_order: 0 };
      setBillingMsg('Saving…', null);
      try {
        const url = id ? `${API_URL}/admin/billing/plans/${id}` : `${API_URL}/admin/billing/plans`;
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: authHeaders(true), body: JSON.stringify(payload) });
        const data = await res.json();
        if (!res.ok) throw new Error((data.detail && (data.detail[0]?.msg || data.detail)) || 'Failed to save plan');
        setBillingMsg('✓ Plan saved', true);
        resetBillingForm();
        loadBillingPlans();
      } catch (e) { setBillingMsg('✗ ' + e.message, false); }
    }

    async function deleteBillingPlan(id) {

      try {
        const res = await fetch(`${API_URL}/admin/billing/plans/${id}`, { method: 'DELETE', headers: authHeaders() });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Failed to delete plan');
        loadBillingPlans();
      } catch (e) { setBillingMsg('✗ ' + e.message, false); }
    }

    async function loadPersonLogs() {

    function applyOtherPersonFilter() {
      const otherField = selectedPerson.type === 'user' ? 'listener_name' : 'caller_name';

      renderOtherPersonSelect();
      renderLogTable();
    }

    function renderOtherPersonSelect() {
      const el = document.getElementById('otherPersonSelect');
      if (!el) return;
      const otherField = selectedPerson.type === 'user' ? 'listener_name' : 'caller_name';
      const names = [...new Set(logsCacheAll.map(row => row[otherField]).filter(Boolean))];
      el.innerHTML = '<option value="">All</option>' + names.map(n => `<option value="${n}" ${otherPersonFilter === n ? 'selected' : ''}>${n}</option>`).join('');
      const arrowRow = document.getElementById('pairArrowRow');

        const rightEl = arrowRow.querySelector('.pair-right');
        if (selectedPerson.type === 'user') {
          leftEl.textContent = selectedPerson.name;
          rightEl.textContent = otherPersonFilter;

          rightEl.textContent = selectedPerson.name;

        arrowRow.style.display = 'none';
      }
    }
    function changeOtherPersonFilter() {
      otherPersonFilter = document.getElementById('otherPersonSelect').value || null;
      applyOtherPersonFilter();
    }

    function renderLogTable() {
      const wrap = document.getElementById('logTableWrap');
      const pagWrap = document.getElementById('paginationWrap');
      if (logsCache.length === 0) {
        const label = logSection === 'calls' ? 'call logs' : logSection === 'recordings' ? 'recordings' : 'chat messages';
        wrap.innerHTML = `<div class="empty-state">No ${label} with other people yet.</div>`;
        pagWrap.innerHTML = '';
        return;
      }

      if (logSection === 'chats') {
        pagWrap.innerHTML = '';
        const ordered = logsCache.slice().reverse();
        const groups = [];
        let currentKey = null;
        ordered.forEach(m => {
          const d = new Date(m.created_at);
          const key = d.toDateString();
          if (key !== currentKey) {
            groups.push({ key, date: d, items: [] });
            currentKey = key;
          }
          groups[groups.length - 1].items.push(m);
        });
        const now = new Date();
        const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const dayDiff = d => Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
        const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const labelFor = d => {
          const diff = dayDiff(d);
          if (diff === 0) return 'Today';
          if (diff === 1) return 'Yesterday';
          if (diff > 1 && diff < 7) return dayNames[d.getDay()];
          return d.toLocaleDateString();
        };
        wrap.innerHTML = `
          <div class="chat-scroll">
            ${groups.map(g => `
              <div class="chat-date-divider"><span class="chat-date-label">${labelFor(g.date)}</span></div>
              <div class="chat-thread">
                ${g.items.map(m => {
          const isUserSender = m.sender_type === 'user';
          const content = m.is_deleted
            ? '<i>deleted</i>'
            : (m.message_type === 'audio'
              ? ('<audio controls src="' + API_URL + m.audio_url + '"></audio>')
              : (m.message || ''));
          const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          return `
                <div class="chat-row ${isUserSender ? 'left' : 'right'}">
                      <div class="chat-bubble ${isUserSender ? 'bubble-left' : 'bubble-right'}">
                        <div class="chat-meta">${isUserSender ? (m.caller_name || 'User') : (m.listener_name || 'Listener')}</div>
          <div class="chat-text">${content}<span class="chat-time">${time}</span></div>
                      </div>
                    </div>`;
        }).join('')}
              </div>
            `).join('')}
          </div>
        `;
        const scrollEl = wrap.querySelector('.chat-scroll');
        if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
        return;
      }

      const totalPages = Math.max(1, Math.ceil(logsCache.length / logPageSize));
      logPage = Math.min(logPage, totalPages);
      const start = (logPage - 1) * logPageSize;
      const pageItems = logsCache.slice(start, start + logPageSize);

      if (logSection === 'calls') {
        wrap.innerHTML = `
          <table>
            <thead><tr><th>ID</th><th>Caller</th><th>Listener</th><th>Status</th><th>Created</th></tr></thead>
            <tbody>
              ${pageItems.map(c => `
                <tr>
                  <td>${c.id}</td>
                  <td>${c.caller_name || ''}</td>
                  <td>${c.listener_name || ''}</td>
                  <td>${c.status}</td>
                  <td>${c.created_at || ''}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        `;
      } else {
        wrap.innerHTML = `
          <table>
            <thead><tr><th>ID</th><th>Caller</th><th>Listener</th><th>Status</th><th>Started</th><th>Ended</th><th>Play</th></tr></thead>
            <tbody>
              ${pageItems.map(r => {
          const audio = r.file_path ? `<audio controls src="${API_URL}/recordings/${r.file_path}"></audio>` : '';
          return `
                <tr>
                  <td>${r.id}</td>
                  <td>${r.caller_name || ''}</td>
                  <td>${r.listener_name || ''}</td>
                  <td>${r.status}</td>
                  <td>${r.started_at || ''}</td>
                  <td>${r.ended_at || ''}</td>
                  <td>${audio}</td>
                </tr>`;
        }).join('')}
            </tbody>
          </table>
        `;
      }

      pagWrap.innerHTML = `
        <button class="btn btn-ghost" ${logPage <= 1 ? 'disabled' : ''} onclick="changeLogPage(-1)">&larr; Prev</button>
        <span>Page ${logPage} of ${totalPages}</span>
        <button class="btn btn-ghost" ${logPage >= totalPages ? 'disabled' : ''} onclick="changeLogPage(1)">Next &rarr;</button>
      `;
    }

    function changeLogPage(delta) {
      logPage += delta;
      renderLogTable();
    }
    async function deletePerson(type, id, name) {
      if (!confirm(`Delete ${type} "${name}"? This will permanently remove all their calls, chats, recordings, ratings, and sessions. This cannot be undone.`)) return;
      try {
        const endpoint = type === 'user' ? `/admin/users/${id}` : `/admin/listeners/${id}`;
        const res = await fetch(API_URL + endpoint, { method: 'DELETE', headers: authHeaders() });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Failed');
        setMsg(`✓ ${type === 'user' ? 'User' : 'Listener'} deleted`, true);
        selectedPerson = null;
        document.getElementById('personContent').innerHTML = '<div class="empty-state">Select a user or listener from the list to view their call logs and recordings.</div>';
        loadPeople();
      } catch (e) { setMsg('✗ ' + e.message, false); }
    }

    async function adjustCoins(userId) {
      const amount = parseInt(document.getElementById('amount-' + userId).value);
      if (!amount) { setMsg('Enter a valid amount.', false); return; }
      try {
        const res = await fetch(API_URL + '/admin/coins/adjust', {
          method: 'POST', headers: authHeaders(true),
          body: JSON.stringify({ user_id: userId, amount })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Failed');
        setMsg('✓ Coins updated', true);
        loadPeople();
      } catch (e) { setMsg('✗ ' + e.message, false); }
    }

    async function generateAdminInvite() {
      const wrap = document.getElementById('inviteLinkWrap');
      wrap.textContent = 'Generating…';
      try {
        const res = await fetch(API_URL + '/admin/auth/invite', {
          method: 'POST', headers: authHeaders(true), body: JSON.stringify({})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Failed');
        const link = window.location.origin + window.location.pathname + '?invite=' + data.invite_token;
        wrap.innerHTML = `<input readonly value="${link}" onclick="this.select()"> <div class="person-sub">Expires: ${new Date(data.expires_at).toLocaleString()}</div>`;
      } catch (e) { wrap.innerHTML = '<span class="err">✗ ' + e.message + '</span>'; }
    }

    window.addEventListener('DOMContentLoaded', initAuth);

    let adminWs = null;
    let adminWsReconnectTimer = null;

    function connectAdminWs() {
      const wsUrl = API_URL.replace('http', 'ws') + '/admin/ws?token=' + encodeURIComponent(getAdminToken());
      adminWs = new WebSocket(wsUrl);
      adminWs.onmessage = (evt) => {
        try {
          const data = JSON.parse(evt.data);
          if (data.type === 'user_status') {
            const u = usersCache.find(x => x.id === data.id);
            if (u) { u.is_online = data.is_online; renderPeopleList(); }
          } else if (data.type === 'listener_status') {
            const l = listenersCache.find(x => x.id === data.id);
            if (l) { l.is_online = data.is_online; renderPeopleList(); }
          }
        } catch (e) {}
      };
      adminWs.onclose = () => {
        clearTimeout(adminWsReconnectTimer);
        adminWsReconnectTimer = setTimeout(connectAdminWs, 3000);
      };
      adminWs.onerror = () => { adminWs.close(); };

    }
  </script>
</body>

</html>
