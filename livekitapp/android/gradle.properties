org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=6
org.gradle.daemon.idletimeout=300000
kotlin.daemon.jvm.options=-Xmx2048m
android.useAndroidX=true
# Kept off: pub-cache dependency sources live on a different Windows drive
# root (C:) than the project (D:), and Kotlin's RelocatableFileToPathConverter
# cannot compute a relative path across drive roots, crashing the incremental
# cache on close (IllegalArgumentException: different roots). Revisit if the
# project and Flutter/pub-cache ever end up on the same drive.
kotlin.incremental=false
# Works around a Gradle VFS-watcher race on this filesystem that intermittently
# reports freshly-written task outputs as missing (gradle/gradle#25204).
org.gradle.vfs.watch=false
org.gradle.parallel=true
org.gradle.caching=true
# Kept off (legacy KGP) rather than on: several pubspec plugins
# (e.g. flutter_callkit_incoming 3.1.5) haven't migrated their Android
# Gradle files to built-in Kotlin yet and fail under AGP 9's built-in-Kotlin
# mode. Flutter explicitly supports this combination (AGP 9+, builtInKotlin=false)
# as the transitional path until all plugins migrate. Revisit this flag
# periodically — flip to true once every plugin below has migrated.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
